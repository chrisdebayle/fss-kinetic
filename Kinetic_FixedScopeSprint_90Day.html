<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixed Scope Sprint &middot; Kinetic AI &middot; Chris Debayle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0B0E11; --ground-view:#101317; --card-dark:#171B20;
  --hair-1:#1B2027; --hair-2:#22272D; --hair-3:#262B31; --hair-4:#2A3037;
  --accent:#F97316; --accent-700:#C85D12; --accent-800:#B65510;
  --primary:#0A66C2; --link-dark:#57A8EE;
  --ink-body:#E8EBEE; --ink-head:#F4F6F8; --ink-2:#A8B0B9;
  --muted-2:#7E858E; --muted-3:#737B84;
  --stage-1:#57A8EE; --stage-2:#4C8FD6; --stage-3:#F97316; --stage-4:#D96A24; --stage-5:#F97316;
  --font-display:'Space Grotesk','Inter',-apple-system,sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --shell-max:1320px;
  --view:var(--accent);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:var(--ground);color:var(--ink-body);
  font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased;}

.app{display:flex;flex-direction:column;height:100vh;width:100vw;}

/* ---------- TOP BAR ---------- */
.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:24px;padding:0 34px;height:62px;border-bottom:1px solid var(--hair-2);background:var(--ground);}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:0.16em;
  color:var(--ink-head);white-space:nowrap;}
.chapnav{display:flex;gap:4px;overflow:hidden;flex-wrap:nowrap;}
.chapnav button{all:unset;cursor:pointer;font-size:10.5px;font-weight:600;letter-spacing:0.11em;
  text-transform:uppercase;color:var(--muted-3);padding:7px 10px;border-bottom:2px solid transparent;
  white-space:nowrap;transition:color .25s ease,border-color .25s ease;}
.chapnav button:hover{color:var(--ink-2);}
.chapnav button.active{color:var(--view);border-bottom-color:var(--view);}
.cobrand{display:flex;align-items:center;gap:12px;white-space:nowrap;}
.cobrand .prep{font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted-3);}
.cobrand img{height:19px;display:block;opacity:.92;}

/* ---------- STAGE ---------- */
.stage{flex:1;position:relative;overflow:hidden;background:var(--ground-view);}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:46px 54px;opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .3s ease,transform .3s ease;}
.slide.active{opacity:1;transform:translateY(0);pointer-events:auto;}
.inner{width:100%;max-width:var(--shell-max);display:flex;flex-direction:column;gap:26px;}
.inner.center{align-items:center;text-align:center;}
/* a note following a grid/table/flow reads as a footnote to it, so tighten that pairing */
.grid + .note,table + .note,.flow + .note,.rail + .note{margin-top:-6px;}

/* ---------- TYPE ---------- */
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--view);}
/* explicit brand-blue override, independent of the per-chapter accent rotation */
.blue-label{color:var(--stage-1) !important;}
.rule.blue-label{background:var(--stage-1) !important;}
.card .tag.blue-label{color:var(--stage-1) !important;}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,4.4vw,58px);
  line-height:1.06;color:var(--accent);letter-spacing:-0.015em;}
h1.light{color:var(--ink-head);}
h2{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,3vw,40px);
  line-height:1.12;color:var(--ink-head);letter-spacing:-0.01em;}
.lede{font-size:clamp(16.5px,1.5vw,21px);line-height:1.6;color:var(--ink-2);max-width:900px;font-weight:300;}
.statement{font-family:var(--font-display);font-weight:500;font-size:clamp(22px,2.6vw,36px);
  line-height:1.32;color:var(--ink-head);max-width:1020px;letter-spacing:-0.01em;}
.statement em{font-style:normal;color:var(--accent);}
/* sub-text: secondary, but sized and toned to actually be read */
.note{font-size:16px;line-height:1.62;color:var(--ink-2);max-width:980px;font-weight:300;}
.note em{font-style:italic;color:var(--ink-head);font-weight:400;}
.quote{font-family:var(--font-display);font-weight:500;font-size:clamp(20px,2.4vw,33px);
  line-height:1.34;color:var(--ink-head);max-width:1000px;border-left:3px solid var(--accent);
  padding-left:26px;letter-spacing:-0.01em;}
.quote .src{display:block;margin-top:18px;font-family:var(--font-body);font-weight:500;
  font-size:12.5px;letter-spacing:0.13em;text-transform:uppercase;color:var(--muted-2);}

/* ---------- CARDS ---------- */
.grid{display:grid;gap:16px;width:100%;}
.g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.card{background:var(--card-dark);border:1px solid var(--hair-3);border-radius:9px;
  padding:26px 24px;display:flex;flex-direction:column;gap:10px;}
.card.hl{border-color:var(--accent-800);}
.card .ct{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--ink-head);}
.card.hl .ct{color:var(--accent);}
.card p{font-size:15.5px;line-height:1.6;color:var(--ink-2);font-weight:300;}
.card .tag{font-size:10.5px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted-2);font-weight:600;}

/* stat */
.stat{background:var(--card-dark);border:1px solid var(--hair-3);border-radius:9px;padding:28px 24px;
  display:flex;flex-direction:column;gap:9px;}
.stat .sv{font-family:var(--font-display);font-weight:700;font-size:clamp(30px,3.4vw,45px);
  color:var(--accent);line-height:1;}
.stat .sk{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted-2);font-weight:600;}
.stat .sd{font-size:14.5px;line-height:1.55;color:var(--ink-2);font-weight:300;}

/* hero number */
.hero{font-family:var(--font-display);font-weight:700;font-size:clamp(92px,13vw,190px);
  color:var(--accent);line-height:.92;letter-spacing:-0.03em;}

/* ---------- THE RAIL ---------- */
.rail{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;width:100%;}
.rl{background:var(--card-dark);border:1px solid var(--hair-3);border-top:3px solid var(--sc);
  border-radius:0 0 9px 9px;padding:22px 18px;display:flex;flex-direction:column;gap:10px;}
.rl .rn{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.15em;
  text-transform:uppercase;color:var(--sc);}
.rl .rt{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--ink-head);line-height:1.22;}
.rl p{font-size:14.5px;line-height:1.55;color:var(--ink-2);font-weight:300;}
.rl .own{margin-top:auto;padding-top:12px;border-top:1px solid var(--hair-2);
  font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sc);font-weight:600;opacity:.85;}

/* ---------- FLOW ---------- */
.flow{display:flex;align-items:stretch;justify-content:center;gap:0;width:100%;flex-wrap:wrap;}
.fb{background:var(--card-dark);border:1px solid var(--hair-3);border-radius:9px;padding:22px 20px;
  min-width:168px;flex:1;max-width:240px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;}
.fb .fv{font-family:var(--font-display);font-weight:700;font-size:34px;color:var(--accent);line-height:1;
  display:flex;align-items:baseline;justify-content:center;white-space:nowrap;}
.fb .fv .to{font-family:var(--font-body);font-size:14px;font-weight:400;color:var(--muted-2);
  padding:0 7px;letter-spacing:0.06em;text-transform:lowercase;}
.fb .fl{font-size:13.5px;line-height:1.5;color:var(--ink-2);font-weight:300;}
.fa{display:flex;align-items:center;padding:0 14px;color:var(--muted-2);font-size:18px;}

/* ---------- LIST ---------- */
.list{display:flex;flex-direction:column;gap:17px;width:100%;max-width:980px;}
.list li{list-style:none;display:flex;gap:20px;align-items:flex-start;font-size:18px;
  line-height:1.52;color:var(--ink-body);font-weight:300;}
.list .n{font-family:var(--font-display);font-weight:700;font-size:13.5px;color:var(--accent);
  min-width:26px;padding-top:4px;letter-spacing:0.05em;}

/* ---------- TABLE ---------- */
table{width:100%;border-collapse:collapse;text-align:left;}
thead th{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--muted-2);padding:0 16px 13px;border-bottom:1px solid var(--accent-800);}
tbody td{font-size:15.5px;line-height:1.55;color:var(--ink-body);padding:17px 16px;
  border-bottom:1px solid var(--hair-2);font-weight:300;}
tbody tr:last-child td{border-bottom:none;}
td.k{font-family:var(--font-display);font-weight:700;color:var(--accent);font-size:14.5px;
  letter-spacing:0.03em;white-space:nowrap;}

/* ---------- BARS ---------- */
.bars{display:flex;align-items:flex-end;justify-content:center;gap:40px;width:100%;max-width:780px;}
.bar{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;}
.bt{width:100%;height:260px;display:flex;align-items:flex-end;}
.bf{width:100%;background:linear-gradient(180deg,var(--accent),rgba(249,115,22,.14));
  border:1px solid var(--accent-800);border-bottom:none;border-radius:7px 7px 0 0;
  display:flex;justify-content:center;padding-top:10px;}
.bf .bv{font-family:var(--font-display);font-weight:700;font-size:27px;color:var(--ground);}
.bl{font-size:14.5px;color:var(--ink-2);text-align:center;line-height:1.5;margin-top:14px;font-weight:300;}

/* ---------- DIVIDER ---------- */
.divider{position:relative;width:100%;}
.dnum{position:absolute;top:50%;left:0;transform:translateY(-56%);font-family:var(--font-display);
  font-weight:700;font-size:clamp(120px,17vw,210px);color:var(--view);opacity:.07;line-height:1;
  user-select:none;z-index:0;letter-spacing:-0.04em;}
.divider>*:not(.dnum){position:relative;z-index:1;}
.rule{width:58px;height:3px;background:var(--view);margin:20px 0;}

/* ---------- BOTTOM BAR ---------- */
.botbar{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 34px;height:52px;border-top:1px solid var(--hair-2);background:var(--ground);}
.counter{font-size:11px;letter-spacing:0.13em;color:var(--muted-3);font-variant-numeric:tabular-nums;
  display:flex;gap:13px;align-items:center;text-transform:uppercase;}
.counter .cur{color:var(--view);font-weight:600;}

/* centred navigation hint */
.navhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:8px;white-space:nowrap;
  font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;font-weight:500;color:var(--muted-3);}
.navhint kbd{font-family:var(--font-body);font-size:10px;font-weight:600;line-height:1;
  border:1px solid var(--hair-4);border-radius:4px;padding:4px 7px;color:var(--ink-2);
  background:var(--card-dark);letter-spacing:0.04em;}
.navhint .sep{color:var(--hair-4);}

.navbtns{display:flex;gap:9px;}
.navbtns button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:7px 14px;
  border:1px solid var(--hair-4);border-radius:5px;font-size:10.5px;letter-spacing:0.13em;
  text-transform:uppercase;color:var(--ink-2);font-weight:600;
  transition:border-color .2s,color .2s,background-color .2s;}
/* brand-coded direction: blue back, orange forward */
#prev{border-color:rgba(87,168,238,.42);color:var(--stage-1);}
#prev:hover{border-color:var(--stage-1);color:var(--stage-1);background:rgba(87,168,238,.12);}
#next{border-color:rgba(249,115,22,.42);color:var(--accent);}
#next:hover{border-color:var(--accent);color:var(--accent);background:rgba(249,115,22,.12);}
.progress{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);
  transition:width .3s ease;z-index:6;}

/* nav tightens before it clips, so the tab bar never silently truncates above the mobile breakpoint */
@media (max-width:1220px){
  .chapnav button{padding:7px 7px;font-size:9.5px;letter-spacing:0.08em;}
  .cobrand .prep{display:none;}
}
@media (max-width:1080px){
  .chapnav button{padding:7px 5px;font-size:8.5px;letter-spacing:0.05em;}
  .wordmark{font-size:12px;}
}

@media (max-width:1000px){
  .g2,.g3,.g4{grid-template-columns:1fr;}
  .rail{grid-template-columns:1fr;}
  .chapnav{display:none;}
  .navhint{display:none;}
  .slide{padding:30px 22px;}
}

/* ---------- PASSWORD GATE ---------- */
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--ground);padding:24px;z-index:20;}
.gate-card{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:22px;}
.gate-brand{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:0.16em;
  color:var(--ink-head);}
.gate-sub{display:flex;align-items:center;gap:10px;font-size:9px;letter-spacing:0.15em;
  text-transform:uppercase;color:var(--muted-3);}
.gate-sub img{height:17px;opacity:.92;}
.gate-title{font-family:var(--font-display);font-weight:700;font-size:clamp(22px,3vw,28px);
  color:var(--ink-head);line-height:1.25;}
.gate-desc{font-size:14.5px;line-height:1.55;color:var(--ink-2);font-weight:300;max-width:360px;}
.gate-form{width:100%;display:flex;flex-direction:column;gap:12px;}
.gate-form input{width:100%;background:var(--card-dark);border:1px solid var(--hair-4);
  border-radius:7px;padding:13px 16px;font-size:15px;color:var(--ink-head);font-family:var(--font-body);
  outline:none;transition:border-color .2s;}
.gate-form input:focus{border-color:var(--accent);}
.gate-form button{all:unset;cursor:pointer;text-align:center;background:var(--accent);
  border:1px solid var(--accent);border-radius:7px;padding:13px 16px;font-size:13px;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;color:var(--ground);font-family:var(--font-display);
  transition:opacity .2s;}
.gate-form button:hover{opacity:.9;}
.gate-form button:disabled{opacity:.55;cursor:default;}
.gate-err{min-height:16px;font-size:12.5px;color:var(--accent);font-weight:500;}
#appRoot{display:none;}
</style>
</head>

var PW_ITER = 250000;
var CH = [{t:"Opening",c:"#F97316",first:0},{t:"Bottleneck",c:"#57A8EE",first:2},{t:"Engagement",c:"#4C8FD6",first:5},{t:"The Metric",c:"#F97316",first:8},{t:"The Rail",c:"#D96A24",first:14},{t:"The Engine",c:"#57A8EE",first:18},{t:"What You Keep",c:"#4C8FD6",first:24},{t:"Terms",c:"#F97316",first:26}];
var STORE_KEY = "fss_kinetic_unlocked_v1";

function b64ToBytes(b64){
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++){ bytes[i] = bin.charCodeAt(i); }
  return bytes;
}

function deriveKey(password, saltBytes){
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey'])
    .then(function(keyMaterial){
      return crypto.subtle.deriveKey(
        {name:'PBKDF2', salt: saltBytes, iterations: PW_ITER, hash:'SHA-256'},
        keyMaterial,
        {name:'AES-GCM', length:256},
        false,
        ['decrypt']
      );
    });
}

function tryUnlock(password){
  var salt = b64ToBytes(PW_SALT);
  var iv = b64ToBytes(PW_IV);
  var ct = b64ToBytes(PW_CT);
  return deriveKey(password, salt)
    .then(function(key){ return crypto.subtle.decrypt({name:'AES-GCM', iv: iv}, key, ct); })
    .then(function(buf){ return new TextDecoder().decode(buf); })
    .catch(function(){ return null; });
}

function initDeck(){
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var total = slides.length, cur = 0;
  var root = document.documentElement;
  var nav = document.getElementById('chapnav');

  CH.forEach(function(c,i){
    var b = document.createElement('button');
    b.textContent = c.t;
    b.dataset.i = i;
    b.addEventListener('click', function(){ go(c.first); });
    nav.appendChild(b);
  });
  var navBtns = Array.prototype.slice.call(nav.querySelectorAll('button'));

  function paint(){
    var s = slides[cur];
    var ci = parseInt(s.dataset.ch, 10);
    root.style.setProperty('--view', CH[ci].c);
    document.getElementById('cnum').textContent = String(cur+1).padStart(2,'0');
    document.getElementById('cname').textContent = CH[ci].t;
    document.getElementById('progress').style.width = ((cur+1)/total*100) + '%';
    navBtns.forEach(function(b,i){ b.classList.toggle('active', i === ci); });
  }
  function go(i){
    if(i < 0 || i >= total || i === cur) return;
    slides[cur].classList.remove('active');
    cur = i;
    slides[cur].classList.add('active');
    paint();
  }
  document.getElementById('next').addEventListener('click', function(){ go(cur+1); });
  document.getElementById('prev').addEventListener('click', function(){ go(cur-1); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(cur+1); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); go(cur-1); }
  });
  var tx = 0;
  document.addEventListener('touchstart', function(e){ tx = e.changedTouches[0].screenX; });
  document.addEventListener('touchend', function(e){
    var d = e.changedTouches[0].screenX - tx;
    if(Math.abs(d) > 50){ go(d < 0 ? cur+1 : cur-1); }
  });
  slides[0].classList.add('active');
  paint();
}

function unlockWith(html){
  document.getElementById('gate').style.display = 'none';
  var appRoot = document.getElementById('appRoot');
  appRoot.innerHTML = html;
  appRoot.style.display = 'block';
  initDeck();
}

(function(){
  var cached = null;
  try{ cached = sessionStorage.getItem(STORE_KEY); }catch(e){}
  if(cached){ unlockWith(cached); return; }

  var form = document.getElementById('gateForm');
  var input = document.getElementById('gatePw');
  var err = document.getElementById('gateErr');
  var btn = document.getElementById('gateBtn');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Checking...';
    tryUnlock(input.value).then(function(html){
      if(html){
        try{ sessionStorage.setItem(STORE_KEY, html); }catch(e){}
        unlockWith(html);
      } else {
        err.textContent = 'Incorrect password. Try again.';
        input.value = '';
        input.focus();
        btn.disabled = false;
        btn.textContent = 'View Plan →';
      }
    });
  });
})();
</script>
